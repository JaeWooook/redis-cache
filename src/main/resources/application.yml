spring:
  application:
    name: redis
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:mysql://localhost:3306/redis_demo?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: demo
    password: demo1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
